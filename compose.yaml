services:
  synapse-init:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:v1.160.0}
    user: "0:0"
    restart: "no"
    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_SERVER_NAME}
      SYNAPSE_REPORT_STATS: "no"
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      UID: "991"
      GID: "991"
      TZ: ${TZ:-America/Santo_Domingo}
    volumes:
      - synapse-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -eu
      if [ -s /data/homeserver.yaml ]; then
        echo "Synapse configuration already exists"
        exit 0
      fi
      echo "Generating Synapse configuration as UID/GID 991"
      exec /start.py generate

  mautrix-config-init:
    image: ${MAUTRIX_META_IMAGE:-dock.mau.dev/mautrix/meta:v26.07}
    user: "0:0"
    restart: "no"
    volumes:
      - mautrix-meta-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -eu
      if [ -s /data/config.yaml ]; then
        echo "mautrix-meta config already exists"
        exit 0
      fi
      echo "Generating mautrix-meta config"
      exec /docker-run.sh

  mautrix-configure:
    image: ${YQ_IMAGE:-mikefarah/yq:4.47.2}
    user: "0:0"
    restart: "no"
    depends_on:
      synapse-init:
        condition: service_completed_successfully
      mautrix-config-init:
        condition: service_completed_successfully
    environment:
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME}
      MATRIX_ADMIN_MXID: ${MATRIX_ADMIN_MXID}
    volumes:
      - mautrix-meta-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -eu
      test -s /data/config.yaml
      yq -i '
        .network.mode = "facebook" |
        .network.marketplace_space = true |
        .bridge.permissions = {} |
        .bridge.permissions[strenv(MATRIX_SERVER_NAME)] = "user" |
        .bridge.permissions[strenv(MATRIX_ADMIN_MXID)] = "admin" |
        .database.type = "sqlite3-fk-wal" |
        .database.uri = "file:/data/mautrix-meta.db?_txlock=immediate" |
        .homeserver.address = "http://synapse:8008" |
        .homeserver.domain = strenv(MATRIX_SERVER_NAME) |
        .homeserver.software = "standard" |
        .appservice.address = "http://mautrix-meta:29319" |
        .appservice.public_address = null |
        .appservice.hostname = "0.0.0.0" |
        .appservice.port = 29319
      ' /data/config.yaml
      echo "mautrix-meta config patched"

  mautrix-registration-init:
    image: ${MAUTRIX_META_IMAGE:-dock.mau.dev/mautrix/meta:v26.07}
    user: "0:0"
    restart: "no"
    depends_on:
      mautrix-configure:
        condition: service_completed_successfully
    volumes:
      - mautrix-meta-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -eu
      if [ -s /data/registration.yaml ]; then
        echo "mautrix-meta registration already exists"
        exit 0
      fi
      echo "Generating mautrix-meta appservice registration"
      exec /docker-run.sh

  synapse-configure:
    image: ${YQ_IMAGE:-mikefarah/yq:4.47.2}
    user: "0:0"
    restart: "no"
    depends_on:
      synapse-init:
        condition: service_completed_successfully
      mautrix-registration-init:
        condition: service_completed_successfully
    volumes:
      - synapse-data:/synapse
      - mautrix-meta-data:/meta:ro
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -eu
      test -s /synapse/homeserver.yaml
      test -s /meta/registration.yaml

      mkdir -p /synapse/appservices
      cp /meta/registration.yaml /synapse/appservices/mautrix-meta.yaml
      chmod 0644 /synapse/appservices/mautrix-meta.yaml

      yq -i '.app_service_config_files = ["/data/appservices/mautrix-meta.yaml"]' /synapse/homeserver.yaml

      # yq/cp run as root and can replace files with root-owned inodes. Restore the
      # ownership expected by the official Synapse image before validating/starting.
      chown -R 991:991 /synapse
      chmod 0755 /synapse /synapse/appservices
      chmod 0644 /synapse/homeserver.yaml /synapse/appservices/mautrix-meta.yaml

      echo "Synapse appservice handoff complete"
      echo "homeserver owner/mode: $(stat -c '%u:%g %a' /synapse/homeserver.yaml)"
      echo "registration owner/mode: $(stat -c '%u:%g %a' /synapse/appservices/mautrix-meta.yaml)"
      echo "registration id/url:"
      yq '.id, .url' /synapse/appservices/mautrix-meta.yaml

  synapse-check-config:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:v1.160.0}
    user: "991:991"
    restart: "no"
    depends_on:
      synapse-configure:
        condition: service_completed_successfully
    volumes:
      - synapse-data:/data:ro
    entrypoint: ["python", "-m", "synapse.config"]
    command: ["-c", "/data/homeserver.yaml"]

  synapse:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:v1.160.0}
    restart: unless-stopped
    depends_on:
      synapse-check-config:
        condition: service_completed_successfully
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      UID: "991"
      GID: "991"
      TZ: ${TZ:-America/Santo_Domingo}
    volumes:
      - synapse-data:/data
    expose:
      - "8008"
    healthcheck:
      # Match the health probe shipped by the official Synapse image. The generated
      # listener may bind IPv6; localhost lets curl select the available loopback.
      test: ["CMD-SHELL", "curl -fSs http://localhost:8008/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    stop_grace_period: 30s

  mautrix-meta:
    image: ${MAUTRIX_META_IMAGE:-dock.mau.dev/mautrix/meta:v26.07}
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
      mautrix-registration-init:
        condition: service_completed_successfully
    volumes:
      - mautrix-meta-data:/data
    expose:
      - "29319"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:29319/_matrix/mau/ready"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

volumes:
  synapse-data:
  mautrix-meta-data:
