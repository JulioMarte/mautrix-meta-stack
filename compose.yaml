services:
  synapse-init:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:v1.160.0}
    user: "0:0"
    restart: "no"
    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_SERVER_NAME}
      SYNAPSE_REPORT_STATS: "no"
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      UID: "991"
      GID: "991"
      TZ: ${TZ:-America/Santo_Domingo}
    volumes:
      - synapse-data-v2:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        : "$${SYNAPSE_SERVER_NAME:?MATRIX_SERVER_NAME is required}"
        case "$$SYNAPSE_SERVER_NAME" in
          *.*) ;;
          *) echo "MATRIX_SERVER_NAME must be a DNS-style Matrix server name" >&2; exit 64 ;;
        esac
        if [ -s /data/homeserver.yaml ]; then
          echo "Synapse configuration already exists for this clean state volume"
          exit 0
        fi
        echo "Generating clean Synapse configuration for $$SYNAPSE_SERVER_NAME"
        exec /start.py generate

  mautrix-config-init:
    image: ${MAUTRIX_META_IMAGE:-dock.mau.dev/mautrix/meta:v26.08.1}
    user: "0:0"
    restart: "no"
    volumes:
      - mautrix-meta-data-v2:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -s /data/config.yaml ]; then
          echo "mautrix-meta config already exists for this clean state volume"
          exit 0
        fi
        echo "Generating clean mautrix-meta config"
        exec /docker-run.sh

  mautrix-configure:
    image: ${YQ_IMAGE:-mikefarah/yq:4.47.2}
    user: "0:0"
    restart: "no"
    depends_on:
      synapse-init:
        condition: service_completed_successfully
      mautrix-config-init:
        condition: service_completed_successfully
    environment:
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME}
      MATRIX_ADMIN_MXID: ${MATRIX_ADMIN_MXID}
      META_PROXY_RESOLVER_SECRET: ${META_PROXY_RESOLVER_SECRET:?META_PROXY_RESOLVER_SECRET is required}
    volumes:
      - mautrix-meta-data-v2:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        : "$${MATRIX_SERVER_NAME:?MATRIX_SERVER_NAME is required}"
        : "$${MATRIX_ADMIN_MXID:?MATRIX_ADMIN_MXID is required}"
        : "$${META_PROXY_RESOLVER_SECRET:?META_PROXY_RESOLVER_SECRET is required}"
        admin_localpart="$${MATRIX_ADMIN_MXID#@}"
        admin_localpart="$${admin_localpart%%:*}"
        if [ -z "$$admin_localpart" ]; then
          echo "MATRIX_ADMIN_MXID must contain a Matrix user localpart" >&2
          exit 64
        fi
        EFFECTIVE_MATRIX_ADMIN_MXID="@$${admin_localpart}:$${MATRIX_SERVER_NAME}"
        export EFFECTIVE_MATRIX_ADMIN_MXID
        if [ "$$EFFECTIVE_MATRIX_ADMIN_MXID" != "$$MATRIX_ADMIN_MXID" ]; then
          echo "Normalizing MATRIX_ADMIN_MXID to $$EFFECTIVE_MATRIX_ADMIN_MXID for MATRIX_SERVER_NAME=$$MATRIX_SERVER_NAME"
        fi
        test -s /data/config.yaml
        yq -i '
          .network.mode = "facebook" |
          .network.marketplace_space = true |
          .network.proxy = "" |
          .network.get_proxy_from = ("http://mautrix:" + strenv(META_PROXY_RESOLVER_SECRET) + "@integration:8080/internal/proxy") |
          .network.proxy_media = true |
          .network.proxy_e2ee = true |
          .network.proxy_messenger_lite = true |
          .network.proxy_other = true |
          .network.thread_backfill.batch_count = -1 |
          .backfill.enabled = true |
          .backfill.max_initial_messages = 100 |
          .backfill.max_catchup_messages = 500 |
          .bridge.resend_bridge_info = true |
          .bridge.permissions = {} |
          .bridge.permissions[strenv(MATRIX_SERVER_NAME)] = "user" |
          .bridge.permissions[strenv(EFFECTIVE_MATRIX_ADMIN_MXID)] = "admin" |
          .encryption.allow = false |
          .encryption.default = false |
          .encryption.require = false |
          .encryption.appservice = false |
          .database.type = "sqlite3-fk-wal" |
          .database.uri = "file:/data/mautrix-meta.db?_txlock=immediate" |
          .homeserver.address = "http://synapse:8008" |
          .homeserver.domain = strenv(MATRIX_SERVER_NAME) |
          .homeserver.software = "standard" |
          .appservice.address = "http://mautrix-meta:29319" |
          .appservice.public_address = null |
          .appservice.hostname = "0.0.0.0" |
          .appservice.port = 29319
        ' /data/config.yaml
        echo "mautrix-meta config patched for $$MATRIX_SERVER_NAME"

  mautrix-registration-init:
    image: ${MAUTRIX_META_IMAGE:-dock.mau.dev/mautrix/meta:v26.08.1}
    user: "0:0"
    restart: "no"
    depends_on:
      mautrix-configure:
        condition: service_completed_successfully
    volumes:
      - mautrix-meta-data-v2:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -s /data/registration.yaml ]; then
          echo "mautrix-meta registration already exists"
          exit 0
        fi
        echo "Generating mautrix-meta appservice registration"
        exec /docker-run.sh

  synapse-configure:
    image: ${YQ_IMAGE:-mikefarah/yq:4.47.2}
    user: "0:0"
    restart: "no"
    depends_on:
      synapse-init:
        condition: service_completed_successfully
      mautrix-registration-init:
        condition: service_completed_successfully
    volumes:
      - synapse-data-v2:/synapse
      - mautrix-meta-data-v2:/meta:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        test -s /synapse/homeserver.yaml
        test -s /meta/registration.yaml
        mkdir -p /synapse/appservices
        cp /meta/registration.yaml /synapse/appservices/mautrix-meta.yaml
        chmod 0644 /synapse/appservices/mautrix-meta.yaml
        yq -i '.app_service_config_files = ["/data/appservices/mautrix-meta.yaml"]' /synapse/homeserver.yaml
        chown -R 991:991 /synapse
        chmod 0755 /synapse /synapse/appservices
        chmod 0644 /synapse/homeserver.yaml /synapse/appservices/mautrix-meta.yaml
        echo "Synapse appservice handoff complete"
        stat -c 'homeserver owner/mode: %u:%g %a' /synapse/homeserver.yaml
        stat -c 'registration owner/mode: %u:%g %a' /synapse/appservices/mautrix-meta.yaml

  synapse-check-config:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:v1.160.0}
    user: "991:991"
    restart: "no"
    depends_on:
      synapse-configure:
        condition: service_completed_successfully
    volumes:
      - synapse-data-v2:/data
    entrypoint: ["python", "-m", "synapse.config"]
    command: ["-c", "/data/homeserver.yaml"]

  synapse:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:v1.160.0}
    restart: unless-stopped
    depends_on:
      synapse-check-config:
        condition: service_completed_successfully
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      UID: "991"
      GID: "991"
      TZ: ${TZ:-America/Santo_Domingo}
    volumes:
      - synapse-data-v2:/data
    expose:
      - "8008"
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:8008/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    stop_grace_period: 30s

  synapse-admin-init:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:v1.160.0}
    user: "991:991"
    restart: "no"
    depends_on:
      synapse:
        condition: service_healthy
    environment:
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME}
      MATRIX_ADMIN_MXID: ${MATRIX_ADMIN_MXID}
      MATRIX_ADMIN_PASSWORD: ${MATRIX_ADMIN_PASSWORD}
    volumes:
      - synapse-data-v2:/data:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        : "$${MATRIX_SERVER_NAME:?MATRIX_SERVER_NAME is required}"
        : "$${MATRIX_ADMIN_MXID:?MATRIX_ADMIN_MXID is required}"
        : "$${MATRIX_ADMIN_PASSWORD:?MATRIX_ADMIN_PASSWORD is required}"
        admin_localpart="$${MATRIX_ADMIN_MXID#@}"
        admin_localpart="$${admin_localpart%%:*}"
        if [ -z "$$admin_localpart" ]; then
          echo "MATRIX_ADMIN_MXID must contain a Matrix user localpart" >&2
          exit 64
        fi
        effective_admin_mxid="@$${admin_localpart}:$${MATRIX_SERVER_NAME}"
        if [ "$$effective_admin_mxid" != "$$MATRIX_ADMIN_MXID" ]; then
          echo "Normalizing MATRIX_ADMIN_MXID to $$effective_admin_mxid for this homeserver"
        fi
        echo "Ensuring Matrix admin account $$effective_admin_mxid exists"
        exec register_new_matrix_user \
          http://synapse:8008 \
          -c /data/homeserver.yaml \
          -u "$$admin_localpart" \
          -p "$$MATRIX_ADMIN_PASSWORD" \
          -a \
          --exists-ok

  integration:
    build:
      context: ./integration
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    depends_on:
      synapse:
        condition: service_healthy
      synapse-admin-init:
        condition: service_completed_successfully
      mautrix-registration-init:
        condition: service_completed_successfully
    environment:
      MATRIX_HOMESERVER: http://synapse:8008
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME}
      MATRIX_ADMIN_MXID: ${MATRIX_ADMIN_MXID}
      MATRIX_ADMIN_PASSWORD: ${MATRIX_ADMIN_PASSWORD}
      INTEGRATION_ADMIN_PASSWORD: ${INTEGRATION_ADMIN_PASSWORD}
      INTEGRATION_SESSION_SECRET: ${INTEGRATION_SESSION_SECRET}
      CHATWOOT_WEBHOOK_SECRET: ${CHATWOOT_WEBHOOK_SECRET}
      META_PROXY_RESOLVER_SECRET: ${META_PROXY_RESOLVER_SECRET:?META_PROXY_RESOLVER_SECRET is required}
      META_PROXY_ENABLED: ${META_PROXY_ENABLED:-false}
      META_PROXY_URL: ${META_PROXY_URL:-}
      INTEGRATION_COOKIE_SECURE: ${INTEGRATION_COOKIE_SECURE:-true}
      ALLOW_INSECURE_CHATWOOT: ${ALLOW_INSECURE_CHATWOOT:-false}
      START_MATRIX_SYNC: "true"
      MAUTRIX_REGISTRATION_PATH: /mautrix/registration.yaml
      NICEGUI_STORAGE_PATH: /data/nicegui
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        : "$${MATRIX_SERVER_NAME:?MATRIX_SERVER_NAME is required}"
        : "$${MATRIX_ADMIN_MXID:?MATRIX_ADMIN_MXID is required}"
        admin_localpart="$${MATRIX_ADMIN_MXID#@}"
        admin_localpart="$${admin_localpart%%:*}"
        if [ -z "$$admin_localpart" ]; then
          echo "MATRIX_ADMIN_MXID must contain a Matrix user localpart" >&2
          exit 64
        fi
        export MATRIX_ADMIN_MXID="@$${admin_localpart}:$${MATRIX_SERVER_NAME}"
        exec python /app/nicegui_app.py
    volumes:
      - integration-data-v1:/data
      - mautrix-meta-data-v2:/mautrix:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    stop_grace_period: 15s

  mautrix-meta:
    image: ${MAUTRIX_META_IMAGE:-dock.mau.dev/mautrix/meta:v26.08.1}
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
      synapse-admin-init:
        condition: service_completed_successfully
      mautrix-registration-init:
        condition: service_completed_successfully
      integration:
        condition: service_healthy
    volumes:
      - mautrix-meta-data-v2:/data
    expose:
      - "29319"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:29319/_matrix/mau/ready"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

volumes:
  synapse-data-v2:
  mautrix-meta-data-v2:
  integration-data-v1:
