services:
  control-plane-data-init:
    image: oven/bun:1.4.2
    user: "0:0"
    restart: "no"
    volumes:
      - control-plane-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /data
        chown -R bun:bun /data
        chmod 0750 /data

  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      control-plane-data-init:
        condition: service_completed_successfully
    environment:
      CONTROL_PLANE_DB_PATH: /data/control-plane.db
      CONTROL_PLANE_ADMIN_TOKEN: ${CONTROL_PLANE_ADMIN_TOKEN:?CONTROL_PLANE_ADMIN_TOKEN is required}
      CONTROL_PLANE_INTERNAL_TOKEN: ${CONTROL_PLANE_INTERNAL_TOKEN:?CONTROL_PLANE_INTERNAL_TOKEN is required}
      PORT: "3000"
      TZ: ${TZ:-America/Santo_Domingo}
    volumes:
      - control-plane-data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/health/ready');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 20s

volumes:
  control-plane-data:
