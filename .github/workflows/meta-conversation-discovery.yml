name: Meta conversation discovery

on:
  pull_request:
    paths:
      - 'compose.yaml'
      - 'integration/meta_portal_materialize.py'
      - 'integration/test_meta_portal_materialize.py'
      - 'integration/runtime_entrypoint.py'
      - 'mautrix-meta-runtime/**'
      - 'mautrix-meta-fork/apply_thread_backfill_refresh.py'
      - '.github/workflows/meta-conversation-discovery.yml'
  push:
    branches:
      - dev
      - 'fix/**'
    paths:
      - 'compose.yaml'
      - 'integration/meta_portal_materialize.py'
      - 'integration/test_meta_portal_materialize.py'
      - 'integration/runtime_entrypoint.py'
      - 'mautrix-meta-runtime/**'
      - 'mautrix-meta-fork/apply_thread_backfill_refresh.py'
      - '.github/workflows/meta-conversation-discovery.yml'

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose model
        env:
          MATRIX_SERVER_NAME: matrix.example.com
          MATRIX_ADMIN_MXID: '@admin:matrix.example.com'
          MATRIX_ADMIN_PASSWORD: test-matrix-password
          INTEGRATION_ADMIN_PASSWORD: test-admin-password
          INTEGRATION_SESSION_SECRET: test-session-secret-01234567890123456789
          CHATWOOT_WEBHOOK_SECRET: test-webhook-secret
          META_PROXY_RESOLVER_SECRET: test-resolver-secret-01234567890123456789
        run: docker compose -f compose.yaml config -q

      - name: Build integration runtime
        run: docker build -t meta-conversation-integration ./integration

      - name: Test proactive portal materialization
        run: |
          docker run --rm \
            -e START_MATRIX_SYNC=false \
            meta-conversation-integration python -m unittest test_meta_portal_materialize.py

      - name: Build exact patched mautrix runtime
        run: docker build -f mautrix-meta-runtime/Dockerfile -t meta-conversation-mautrix .

      - name: Assert runtime service uses patched thread discovery image
        run: |
          grep -Fq 'dockerfile: mautrix-meta-runtime/Dockerfile' compose.yaml
          grep -Fq 'Starting thread backfill from connect watchdog' mautrix-meta-fork/apply_thread_backfill_refresh.py
          grep -Fq 'threadBackfillLock.TryLock()' mautrix-meta-fork/apply_thread_backfill_refresh.py
