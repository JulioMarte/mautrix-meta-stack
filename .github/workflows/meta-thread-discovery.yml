name: Meta thread discovery

on:
  pull_request:
    paths:
      - 'compose.yaml'
      - 'integration/meta_portal_reconcile.py'
      - 'integration/meta_debug_observability.py'
      - 'integration/runtime_entrypoint.py'
      - 'integration/history_safety_v9.py'
      - 'integration/conversation_lifecycle_v10.py'
      - 'integration/conversation_lifecycle_hardening_v11.py'
      - 'integration/conversation_lifecycle_callback_v10.py'
      - 'integration/chatwoot_target_guard_v11.py'
      - 'integration/test_conversation_lifecycle_v10.py'
      - 'integration/test_conversation_lifecycle_adversarial_v11.py'
      - 'integration/test_conversation_lifecycle_callback_v10.py'
      - 'integration/test_chatwoot_target_guard_v11.py'
      - 'integration/test_history_safety_v9.py'
      - 'integration/test_meta_portal_reconcile.py'
      - 'integration/test_meta_portal_materialization.py'
      - 'chatwoot-extension/**'
      - 'docs/architecture/bidirectional-conversation-deletion.md'
      - 'mautrix-meta-runtime/**'
      - 'mautrix-meta-fork/**'
      - '.github/workflows/meta-thread-discovery.yml'
  push:
    branches:
      - dev
    paths:
      - 'compose.yaml'
      - 'integration/meta_portal_reconcile.py'
      - 'integration/meta_debug_observability.py'
      - 'integration/runtime_entrypoint.py'
      - 'integration/history_safety_v9.py'
      - 'integration/conversation_lifecycle_v10.py'
      - 'integration/conversation_lifecycle_hardening_v11.py'
      - 'integration/conversation_lifecycle_callback_v10.py'
      - 'integration/chatwoot_target_guard_v11.py'
      - 'integration/test_conversation_lifecycle_v10.py'
      - 'integration/test_conversation_lifecycle_adversarial_v11.py'
      - 'integration/test_conversation_lifecycle_callback_v10.py'
      - 'integration/test_chatwoot_target_guard_v11.py'
      - 'integration/test_history_safety_v9.py'
      - 'integration/test_meta_portal_reconcile.py'
      - 'integration/test_meta_portal_materialization.py'
      - 'chatwoot-extension/**'
      - 'docs/architecture/bidirectional-conversation-deletion.md'
      - 'mautrix-meta-runtime/**'
      - 'mautrix-meta-fork/**'
      - '.github/workflows/meta-thread-discovery.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test deployed runtime transform guards
        run: |
          python3 -m unittest mautrix-meta-runtime/test_thread_backfill_refresh.py
          python3 -m unittest mautrix-meta-runtime/test_bloks_login_compat.py

      - name: Verify deployment build resource bounds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('mautrix-meta-runtime/Dockerfile').read_text()
          assert 'GOMAXPROCS=1' in text, text
          assert 'GOFLAGS="-p=1"' in text, text
          assert 'GOMEMLIMIT=768MiB' in text, text
          PY

      - name: Verify bounded Meta thread rediscovery policy
        run: |
          sh -n mautrix-meta-runtime/safe-docker-run.sh
          python3 - <<'PY'
          from pathlib import Path
          text = Path('mautrix-meta-runtime/safe-docker-run.sh').read_text()
          assert 'batch_count=2' in text, text
          assert 'batch_count=5' in text, text
          assert 'batch_delay=20s' in text, text
          assert 'batch_delay=10s' in text, text
          assert 'batch_count=-1' not in text, text
          PY

      - name: Build deployed v26.08.1 mautrix runtime
        run: docker build -f mautrix-meta-runtime/Dockerfile -t mautrix-meta-runtime-test .

      - name: Verify Compose uses the patched runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('compose.yaml').read_text()
          block = text.split('  mautrix-meta:\n', 1)[1].split('\nvolumes:\n', 1)[0]
          assert 'dockerfile: mautrix-meta-runtime/Dockerfile' in block, block
          assert 'dock.mau.dev/mautrix/meta:v26.08.1' not in block, block
          PY

      - name: Preserve control-plane fork transform guard
        run: python3 -m unittest mautrix-meta-fork/test_thread_backfill_refresh.py

      - name: Build integration sidecar
        run: docker build -t meta-chatwoot-integration ./integration

      - name: Test authoritative portal reconciliation
        run: docker run --rm meta-chatwoot-integration python -m unittest test_meta_portal_reconcile.py

      - name: Test Chatwoot portal materialization
        run: docker run --rm meta-chatwoot-integration python -m unittest test_meta_portal_materialization.py

      - name: Test bounded history safety and incremental resync
        run: docker run --rm meta-chatwoot-integration python -m unittest test_history_safety_v9.py

      - name: Test bidirectional conversation lifecycle
        run: docker run --rm meta-chatwoot-integration python -m unittest test_conversation_lifecycle_v10.py

      - name: Test signed production lifecycle callback wiring
        run: docker run --rm meta-chatwoot-integration python -m unittest test_conversation_lifecycle_callback_v10.py

      - name: Validate Chatwoot deletion extension contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ruby = Path('chatwoot-extension/config/initializers/meta_conversation_delete_webhook.rb').read_text()
          job = Path('chatwoot-extension/app/jobs/meta_conversation_delete_webhook_job.rb').read_text()
          dockerfile = Path('chatwoot-extension/Dockerfile').read_text()
          assert 'def conversation_deleted(event)' in ruby
          assert 'MetaConversationDeleteWebhookJob.perform_later(inbox.id, payload)' in ruby
          assert 'channel.hmac_token' not in ruby
          assert 'secret =' not in ruby
          assert "event: __method__.to_s" in ruby
          assert 'def perform(inbox_id, payload)' in job
          assert 'Inbox.find_by(id: inbox_id)' in job
          assert 'channel.hmac_token' in job
          assert 'channel.webhook_url' in job
          assert "X-Chatwoot-Timestamp" in job
          assert "X-Chatwoot-Signature" in job
          assert "OpenSSL::HMAC.hexdigest('SHA256'" in job
          assert 'CHATWOOT_BASE_IMAGE' in dockerfile
          assert ':latest' not in dockerfile
          PY

      - name: Verify diagnostic module imports in production environment
        run: |
          docker run --rm \
            -e DATA_DIR=/tmp/integration-debug-test \
            -e MATRIX_ADMIN_MXID='@admin:matrix.example.com' \
            -e MATRIX_ADMIN_PASSWORD=matrix-password-long-value \
            -e INTEGRATION_ADMIN_PASSWORD=admin-password-long-value \
            -e CHATWOOT_WEBHOOK_SECRET=webhook-secret-long-value \
            -e INTEGRATION_SESSION_SECRET=session-secret-long-enough-for-debug-tests \
            -e META_PROXY_RESOLVER_SECRET=resolver-secret-long-value \
            -e INTEGRATION_COOKIE_SECURE=false \
            -e START_MATRIX_SYNC=false \
            -e ALLOW_INSECURE_CHATWOOT=true \
            -e INTEGRATION_META_DEBUG=false \
            meta-chatwoot-integration python -c "import meta_debug_observability; import conversation_lifecycle_v10; import conversation_lifecycle_hardening_v11; import conversation_lifecycle_callback_v10; import chatwoot_target_guard_v11; assert callable(meta_debug_observability.collect_once); assert callable(conversation_lifecycle_v10.install); assert callable(conversation_lifecycle_hardening_v11.install); assert callable(conversation_lifecycle_callback_v10.install); assert callable(chatwoot_target_guard_v11.install)"
