name: Phase 4 Matrix to Chatwoot

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
      - 'feature/**'
      - 'fix/**'

concurrency:
  group: phase4-matrix-chatwoot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-chatwoot-attachments:
    runs-on: ubuntu-latest
    env:
      MATRIX_SERVER_NAME: matrix.example.com
      MATRIX_ADMIN_MXID: '@admin:matrix.example.com'
      MATRIX_ADMIN_PASSWORD: integration-password
      SYNAPSE_IMAGE: matrixdotorg/synapse:v1.160.0
      MAUTRIX_META_IMAGE: dock.mau.dev/mautrix/meta:v26.07
      YQ_IMAGE: mikefarah/yq:4.47.2
      TZ: America/Santo_Domingo
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral integration credentials
        shell: bash
        run: |
          echo "CONTROL_PLANE_ADMIN_TOKEN=admin-$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "CONTROL_PLANE_INTERNAL_TOKEN=internal-$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "CHATWOOT_CI_TOKEN=chatwoot-$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "MATRIX_MEDIA_CI_TOKEN=matrix-media-$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Validate Phase 4 topology and script
        run: |
          docker compose -f compose.yaml -f compose.control-plane.yaml -f compose.phase4.yaml config -q
          bash -n scripts/phase4-integration.sh
      - name: Run Matrix to Chatwoot media integration
        run: bash scripts/phase4-integration.sh
      - name: Dump Phase 4 logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.control-plane.yaml -f compose.phase4.yaml logs --no-color || true
      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml -f compose.control-plane.yaml -f compose.phase4.yaml down -v --remove-orphans || true
