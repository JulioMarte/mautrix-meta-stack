name: Phase 3 patched topology

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
  push:
    branches:
      - feature/mautrix-egress-phase-3
      - dev

concurrency:
  group: phase3-topology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patched-topology:
    runs-on: ubuntu-latest
    env:
      MATRIX_SERVER_NAME: matrix.example.com
      MATRIX_ADMIN_MXID: '@admin:matrix.example.com'
      MATRIX_ADMIN_PASSWORD: phase3-ci-matrix-password
      SYNAPSE_IMAGE: matrixdotorg/synapse:v1.160.0
      MAUTRIX_META_IMAGE: dock.mau.dev/mautrix/meta:v26.07
      YQ_IMAGE: mikefarah/yq:4.47.2
      TZ: America/Santo_Domingo
    steps:
      - uses: actions/checkout@v4

      - name: Create ephemeral integration credentials
        run: |
          echo "CONTROL_PLANE_ADMIN_TOKEN=admin-$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "CONTROL_PLANE_INTERNAL_TOKEN=internal-$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "EGRESS_PROXY_CI_PASSWORD=proxy-$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Validate Phase 3 artifacts
        run: |
          bash -n scripts/phase3-integration.sh
          docker compose -f compose.yaml -f compose.control-plane.yaml -f compose.ci.yaml -f compose.phase3.yaml config -q

      - name: Build patched mautrix image from pinned upstream
        run: docker compose -f compose.yaml -f compose.control-plane.yaml -f compose.ci.yaml -f compose.phase3.yaml build mautrix-meta

      - name: Run patched topology integration
        run: bash scripts/phase3-integration.sh

      - name: Dump topology logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.control-plane.yaml -f compose.ci.yaml -f compose.phase3.yaml logs --no-color || true
