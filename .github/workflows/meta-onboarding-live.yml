name: Meta onboarding live stack

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - dev
    paths:
      - 'compose.yaml'
      - 'integration/**'
      - 'meta-auth-helper/**'
      - '.github/workflows/meta-onboarding-live.yml'
      - '.github/workflows/meta-onboarding.yml'
  pull_request:
    paths:
      - 'compose.yaml'
      - 'integration/**'
      - 'meta-auth-helper/**'
      - '.github/workflows/meta-onboarding-live.yml'
      - '.github/workflows/meta-onboarding.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-provisioning-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MATRIX_SERVER_NAME: matrix.example.com
      MATRIX_ADMIN_MXID: '@admin:matrix.example.com'
      MATRIX_ADMIN_PASSWORD: ci-test-value-not-a-secret
      INTEGRATION_ADMIN_PASSWORD: ci-integration-admin-long-value
      INTEGRATION_SESSION_SECRET: ci-session-secret-012345678901234567890123456789
      CHATWOOT_WEBHOOK_SECRET: ci-webhook-secret-long-value
      META_PROXY_RESOLVER_SECRET: ci-resolver-secret-long-value
      META_PROXY_ENABLED: 'false'
      META_PROXY_URL: ''
      INTEGRATION_COOKIE_SECURE: 'false'
      ALLOW_INSECURE_CHATWOOT: 'false'
      SYNAPSE_IMAGE: matrixdotorg/synapse:v1.160.0
      MAUTRIX_META_IMAGE: dock.mau.dev/mautrix/meta:v26.08.1
      YQ_IMAGE: mikefarah/yq:4.47.2
      TZ: America/Santo_Domingo

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose model
        run: docker compose -f compose.yaml config -q

      - name: Start exact stack
        run: docker compose -f compose.yaml up -d synapse integration mautrix-meta

      - name: Wait for runtime health
        shell: bash
        run: |
          set -euo pipefail
          wait_healthy() {
            service="$1"
            timeout="$2"
            cid="$(docker compose -f compose.yaml ps -q "$service")"
            test -n "$cid"
            end=$((SECONDS + timeout))
            while [ "$SECONDS" -lt "$end" ]; do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")"
              echo "$service: $status"
              [ "$status" = healthy ] && return 0
              case "$status" in unhealthy|exited|dead) return 1;; esac
              sleep 3
            done
            return 1
          }
          wait_healthy synapse 120
          wait_healthy integration 120
          wait_healthy mautrix-meta 120

      - name: Verify isolated secret and deny full config access
        run: |
          docker compose -f compose.yaml exec -T integration python - <<'PY'
          import stat
          from pathlib import Path
          from meta_provisioning import default_config

          secret_path = Path('/run/mautrix-provisioning/shared_secret')
          st = secret_path.stat()
          mode = stat.S_IMODE(st.st_mode)
          print(f'isolated provisioning secret: uid={st.st_uid} gid={st.st_gid} mode={mode:o}')
          assert mode & 0o077 == 0, 'provisioning secret must not be group/world readable'
          assert len(secret_path.read_text(encoding='utf-8').strip()) >= 16

          cfg = default_config()
          assert cfg.shared_secret not in {'', 'generate', 'disable'}
          assert len(cfg.shared_secret) >= 16

          try:
              Path('/mautrix/config.yaml').read_text(encoding='utf-8')
          except PermissionError:
              print('full mautrix config correctly inaccessible to integration')
          else:
              raise AssertionError('integration unexpectedly retained read access to full mautrix config')
          PY

      - name: Exercise real v26.08.1 provisioning state machine
        run: docker compose -f compose.yaml exec -T integration python /app/smoke_mautrix_provisioning.py

      - name: Verify running production process exposes managed primary and cookie fallback
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.yaml exec -T integration sh -c '
            set -eu
            cmdline="$(tr "\000" " " < /proc/1/cmdline)"
            echo "integration PID 1: $cmdline"
            case "$cmdline" in
              *"python /app/runtime_entrypoint.py"*) ;;
              *) echo "integration PID 1 is not runtime_entrypoint.py" >&2; exit 1 ;;
            esac
            grep -Fq '\''("meta", "Facebook Messenger", "forum", "/admin/meta")'\'' /app/meta_admin_patch.py
            grep -Fq '\''("meta_fallback", "Facebook web fallback", "cookie", "/admin/meta-cookie")'\'' /app/meta_admin_patch.py
            ! grep -Fq '\''("meta", "Facebook Messenger", "forum", "/admin/meta-cookie")'\'' /app/meta_admin_patch.py
            grep -Fq '\''import meta_cookie_page'\'' /app/runtime_entrypoint.py
            grep -Fq '\''@ui.page("/admin/meta-cookie")'\'' /app/meta_cookie_page.py
            grep -Fq '\''Copy as cURL'\'' /app/meta_cookie_page.py
            grep -Fq '\''Network / Red'\'' /app/meta_cookie_page.py
            grep -Fq '\''@ui.page("/admin/meta")'\'' /app/nicegui_app.py
            grep -Fq '\''create_pairing(saved_step)'\'' /app/nicegui_app.py
            ! grep -Fq '\''Copy as cURL'\'' /app/nicegui_app.py
          '
          docker compose -f compose.yaml exec -T integration python - <<'PY'
          import urllib.error
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          def fetch(path):
              request = urllib.request.Request(f'http://127.0.0.1:8080{path}')
              try:
                  response = opener.open(request, timeout=5)
              except urllib.error.HTTPError as exc:
                  response = exc
              return response.status, response.headers

          cookie_status, cookie_headers = fetch('/admin/meta-cookie')
          managed_status, managed_headers = fetch('/admin/meta')
          assert cookie_status == 200, f'/admin/meta-cookie returned {cookie_status}'
          assert managed_status == 200, f'/admin/meta returned {managed_status}'
          assert cookie_headers.get('Location') not in {'/admin/meta', '/admin/meta/'}, cookie_headers.get('Location')
          assert managed_headers.get('Location') not in {'/admin/meta-cookie', '/admin/meta-cookie/'}, managed_headers.get('Location')
          print('running production process registers managed Meta as primary and cookie flow as fallback')
          PY

      - name: Confirm isolated secret survives mautrix runtime rewrite
        run: |
          docker compose -f compose.yaml exec -T integration python - <<'PY'
          from meta_provisioning import default_config
          cfg = default_config()
          assert len(cfg.shared_secret) >= 16
          print('isolated provisioning secret remains readable after mautrix runtime start')
          PY

      - name: Confirm provisioning port has no host binding
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker compose -f compose.yaml ps -q mautrix-meta)"
          test -n "$cid"
          docker inspect "$cid" > /tmp/mautrix-meta-inspect.json
          python - <<'PY'
          import json

          data = json.load(open('/tmp/mautrix-meta-inspect.json', encoding='utf-8'))[0]
          bindings = (data.get('HostConfig') or {}).get('PortBindings') or {}
          ports = (data.get('NetworkSettings') or {}).get('Ports') or {}
          assert not bindings.get('29319/tcp'), f'29319 has host PortBindings: {bindings.get("29319/tcp")!r}'
          assert ports.get('29319/tcp') in (None, []), f'29319 has published NetworkSettings binding: {ports.get("29319/tcp")!r}'
          print('mautrix provisioning port 29319 is container-network-only')
          PY

      - name: Show safe onboarding diagnostics
        if: always()
        run: |
          echo '--- meta onboarding structured diagnostics ---'
          docker compose -f compose.yaml logs --no-color integration 2>/dev/null | grep '"component":"meta_onboarding"' || true

      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose -f compose.yaml ps -a || true
          docker compose -f compose.yaml logs --no-color synapse integration mautrix-meta mautrix-config-init mautrix-configure mautrix-registration-init mautrix-provisioning-secret-init integration-data-init || true

      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml down -v --remove-orphans || true
