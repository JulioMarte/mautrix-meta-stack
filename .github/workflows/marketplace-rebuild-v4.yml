name: Validate marketplace rebuild v4

on:
  pull_request:
  push:
    branches:
      - dev

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build integration sidecar
        run: docker build -t meta-chatwoot-integration ./integration
      - name: Run Marketplace rebuild regression tests
        run: |
          docker run --rm \
            -e DATA_DIR=/tmp/integration-marketplace-rebuild-test \
            -e MATRIX_ADMIN_MXID='@admin:matrix.example.com' \
            -e MATRIX_ADMIN_PASSWORD=matrix-password-long-value \
            -e INTEGRATION_ADMIN_PASSWORD=admin-password-long-value \
            -e CHATWOOT_WEBHOOK_SECRET=webhook-secret-long-value \
            -e INTEGRATION_SESSION_SECRET=session-secret-long-enough-for-marketplace-rebuild-tests \
            -e META_PROXY_RESOLVER_SECRET=resolver-secret-long-value \
            -e INTEGRATION_COOKIE_SECURE=false \
            -e START_MATRIX_SYNC=false \
            -e ALLOW_INSECURE_CHATWOOT=true \
            meta-chatwoot-integration python -m unittest test_marketplace_rebuild_v4.py
      - name: Run Marketplace listing-card regression tests
        run: |
          docker run --rm \
            -e DATA_DIR=/tmp/integration-marketplace-listing-test \
            -e MATRIX_ADMIN_MXID='@admin:matrix.example.com' \
            -e MATRIX_ADMIN_PASSWORD=matrix-password-long-value \
            -e INTEGRATION_ADMIN_PASSWORD=admin-password-long-value \
            -e CHATWOOT_WEBHOOK_SECRET=webhook-secret-long-value \
            -e INTEGRATION_SESSION_SECRET=session-secret-long-enough-for-marketplace-listing-tests \
            -e META_PROXY_RESOLVER_SECRET=resolver-secret-long-value \
            -e INTEGRATION_COOKIE_SECURE=false \
            -e START_MATRIX_SYNC=false \
            -e ALLOW_INSECURE_CHATWOOT=true \
            meta-chatwoot-integration python -m unittest test_marketplace_listing_v5.py
      - name: Run Marketplace listing discovery regressions
        run: |
          docker run --rm \
            -e DATA_DIR=/tmp/integration-marketplace-listing-v6-test \
            -e MATRIX_ADMIN_MXID='@admin:matrix.example.com' \
            -e MATRIX_ADMIN_PASSWORD=matrix-password-long-value \
            -e INTEGRATION_ADMIN_PASSWORD=admin-password-long-value \
            -e CHATWOOT_WEBHOOK_SECRET=webhook-secret-long-value \
            -e INTEGRATION_SESSION_SECRET=session-secret-long-enough-for-marketplace-listing-v6-tests \
            -e META_PROXY_RESOLVER_SECRET=resolver-secret-long-value \
            -e INTEGRATION_COOKIE_SECURE=false \
            -e START_MATRIX_SYNC=false \
            -e ALLOW_INSECURE_CHATWOOT=true \
            meta-chatwoot-integration python -m unittest test_marketplace_listing_discovery_v6.py
      - name: Run authenticated Marketplace listing-link regressions
        run: |
          docker run --rm \
            -e DATA_DIR=/tmp/integration-marketplace-listing-auth-v7-test \
            -e MATRIX_ADMIN_MXID='@admin:matrix.example.com' \
            -e MATRIX_ADMIN_PASSWORD=matrix-password-long-value \
            -e INTEGRATION_ADMIN_PASSWORD=admin-password-long-value \
            -e CHATWOOT_WEBHOOK_SECRET=webhook-secret-long-value \
            -e INTEGRATION_SESSION_SECRET=session-secret-long-enough-for-marketplace-listing-auth-v7-tests \
            -e META_PROXY_RESOLVER_SECRET=resolver-secret-long-value \
            -e INTEGRATION_COOKIE_SECURE=false \
            -e START_MATRIX_SYNC=false \
            -e ALLOW_INSECURE_CHATWOOT=true \
            meta-chatwoot-integration python -m unittest test_marketplace_listing_auth_v7.py
