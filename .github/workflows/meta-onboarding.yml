name: Meta onboarding

on:
  pull_request:
    paths:
      - 'compose.yaml'
      - 'integration/meta_provisioning.py'
      - 'integration/meta_cookie_auth.py'
      - 'integration/meta_cookie_page.py'
      - 'integration/meta_legacy_redirect.py'
      - 'integration/meta_helper_handoff.py'
      - 'integration/meta_helper_routes.py'
      - 'integration/meta_onboarding_diagnostics.py'
      - 'integration/meta_login_recovery.py'
      - 'integration/meta_admin_patch.py'
      - 'integration/runtime_entrypoint.py'
      - 'integration/nicegui_app.py'
      - 'integration/nicegui_legacy.py'
      - 'integration/Dockerfile'
      - 'integration/test_meta_cookie_auth.py'
      - 'integration/test_meta_admin_patch.py'
      - 'integration/test_meta_bridgev2_input_compat.py'
      - 'integration/test_meta_provisioning.py'
      - 'integration/test_meta_provisioning_http.py'
      - 'integration/test_meta_helper_handoff.py'
      - 'integration/test_meta_helper_routes.py'
      - 'integration/test_meta_managed_onboarding_e2e.py'
      - 'integration/test_meta_login_recovery.py'
      - 'integration/test_meta_login_method_selection.py'
      - 'integration/smoke_mautrix_provisioning.py'
      - 'meta-auth-helper/**'
      - 'docs/architecture/managed-meta-onboarding.md'
      - 'docs/architecture/managed-meta-onboarding-implementation.md'
      - '.github/workflows/meta-onboarding.yml'
      - '.github/workflows/meta-onboarding-live.yml'
      - '.github/workflows/validate.yml'
  push:
    branches:
      - dev
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'compose.yaml'
      - 'integration/meta_provisioning.py'
      - 'integration/meta_cookie_auth.py'
      - 'integration/meta_cookie_page.py'
      - 'integration/meta_legacy_redirect.py'
      - 'integration/meta_helper_handoff.py'
      - 'integration/meta_helper_routes.py'
      - 'integration/meta_onboarding_diagnostics.py'
      - 'integration/meta_login_recovery.py'
      - 'integration/meta_admin_patch.py'
      - 'integration/runtime_entrypoint.py'
      - 'integration/nicegui_app.py'
      - 'integration/nicegui_legacy.py'
      - 'integration/Dockerfile'
      - 'integration/test_meta_cookie_auth.py'
      - 'integration/test_meta_admin_patch.py'
      - 'integration/test_meta_bridgev2_input_compat.py'
      - 'integration/test_meta_provisioning.py'
      - 'integration/test_meta_provisioning_http.py'
      - 'integration/test_meta_helper_handoff.py'
      - 'integration/test_meta_helper_routes.py'
      - 'integration/test_meta_managed_onboarding_e2e.py'
      - 'integration/test_meta_login_recovery.py'
      - 'integration/test_meta_login_method_selection.py'
      - 'integration/smoke_mautrix_provisioning.py'
      - 'meta-auth-helper/**'
      - 'docs/architecture/managed-meta-onboarding.md'
      - 'docs/architecture/managed-meta-onboarding-implementation.md'
      - '.github/workflows/meta-onboarding.yml'
      - '.github/workflows/meta-onboarding-live.yml'
      - '.github/workflows/validate.yml'

jobs:
  onboarding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert Compose uses cookie-first production onboarding with managed fallback
        run: |
          grep -Fq 'exec python /app/runtime_entrypoint.py' compose.yaml
          if grep -Fq 'exec python /app/nicegui_app.py' compose.yaml; then
            echo 'compose.yaml bypasses runtime_entrypoint.py and disables production route registration' >&2
            exit 1
          fi
          grep -Fq '("meta", "Facebook Messenger", "forum", "/admin/meta-cookie")' integration/meta_admin_patch.py
          grep -Fq 'import meta_cookie_page' integration/runtime_entrypoint.py
          grep -Fq '@ui.page("/admin/meta")' integration/nicegui_app.py
          grep -Fq '@ui.page("/admin/meta-cookie")' integration/meta_cookie_page.py

      - name: Build integration image
        run: docker build -t meta-onboarding-test ./integration

      - name: Run cookie onboarding, managed fallback, helper security and end-to-end journey tests
        run: |
          docker run --rm \
            -e MATRIX_ADMIN_MXID='@admin:matrix.example.com' \
            -e MATRIX_ADMIN_PASSWORD=matrix-password-long-value \
            -e INTEGRATION_ADMIN_PASSWORD=admin-password-long-value \
            -e CHATWOOT_WEBHOOK_SECRET=webhook-secret-long-value \
            -e INTEGRATION_SESSION_SECRET=session-secret-long-enough-for-meta-tests \
            -e META_PROXY_RESOLVER_SECRET=resolver-secret-long-value \
            -e MAUTRIX_PROVISIONING_SECRET=provisioning-secret-long-value \
            -e INTEGRATION_COOKIE_SECURE=false \
            -e START_MATRIX_SYNC=false \
            -e ALLOW_INSECURE_CHATWOOT=true \
            meta-onboarding-test python -m unittest \
              test_meta_cookie_auth.py \
              test_meta_provisioning.py \
              test_meta_provisioning_http.py \
              test_meta_helper_handoff.py \
              test_meta_helper_routes.py \
              test_meta_bridgev2_input_compat.py \
              test_meta_admin_patch.py \
              test_meta_managed_onboarding_e2e.py \
              test_meta_login_recovery.py \
              test_meta_login_method_selection.py

      - name: Import actual production NiceGUI entrypoint
        run: |
          docker run --rm \
            -e DATA_DIR=/tmp/integration-onboarding-test \
            -e MATRIX_ADMIN_MXID='@admin:matrix.example.com' \
            -e MATRIX_ADMIN_PASSWORD=matrix-password-long-value \
            -e INTEGRATION_ADMIN_PASSWORD=admin-password-long-value \
            -e CHATWOOT_WEBHOOK_SECRET=webhook-secret-long-value \
            -e INTEGRATION_SESSION_SECRET=session-secret-long-enough-for-onboarding-tests \
            -e META_PROXY_RESOLVER_SECRET=resolver-secret-long-value \
            -e MAUTRIX_PROVISIONING_SECRET=provisioning-secret-long-value \
            -e INTEGRATION_COOKIE_SECURE=false \
            -e START_MATRIX_SYNC=false \
            -e ALLOW_INSECURE_CHATWOOT=true \
            meta-onboarding-test python -c "import inspect, runtime_entrypoint, admin_v2, meta_admin_patch, nicegui_app, meta_cookie_page; assert admin_v2._admin_chrome is meta_admin_patch.admin_chrome; assert callable(nicegui_app.meta_runtime_state); assert callable(nicegui_app.meta_onboarding_page); assert callable(meta_cookie_page.meta_cookie_page); src=inspect.getsource(runtime_entrypoint); assert 'import meta_cookie_page' in src"

      - name: Preserve existing NiceGUI tests
        run: |
          docker run --rm \
            -e DATA_DIR=/tmp/integration-nicegui-regression \
            -e MATRIX_ADMIN_MXID='@admin:matrix.example.com' \
            -e MATRIX_ADMIN_PASSWORD=matrix-password-long-value \
            -e INTEGRATION_ADMIN_PASSWORD=admin-password-long-value \
            -e CHATWOOT_WEBHOOK_SECRET=webhook-secret-long-value \
            -e INTEGRATION_SESSION_SECRET=session-secret-long-enough-for-regression-tests \
            -e META_PROXY_RESOLVER_SECRET=resolver-secret-long-value \
            -e MAUTRIX_PROVISIONING_SECRET=provisioning-secret-long-value \
            -e INTEGRATION_COOKIE_SECURE=false \
            -e START_MATRIX_SYNC=false \
            -e ALLOW_INSECURE_CHATWOOT=true \
            meta-onboarding-test python -m unittest test_nicegui_app.py

      - name: Run helper security unit tests
        run: |
          node --check meta-auth-helper/main.js
          node --check meta-auth-helper/helper_logic.js
          node --test meta-auth-helper/test/*.test.js
